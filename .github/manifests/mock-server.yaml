apiVersion: v1
kind: Pod
metadata:
  name: mock-server
  namespace: default
  labels:
    app: mock-server
spec:
  nodeName: ci-cp
  serviceAccountName: mock-server
  containers:
  - name: mock-server
    image: mock_cohdi:test3
    ports:
    - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: mock-server
  namespace: default
spec:
  selector:
    app: mock-server
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 443
    targetPort: 443
