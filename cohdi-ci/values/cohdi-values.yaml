# Based on the default values.yaml of the upstream CoHDI chart:
#   https://github.com/CoHDI/cohdi-chart/blob/main/values.yaml
# Local changes for this mock-CDI test environment:
#   - deviceInfo: Tesla T4 added as index 4 (ci-worker's real GPU);
#     cannot-coexist-with lists extended accordingly
#   - fabricIdRange: "[0]" -> '[1]' — must match the fabric_id the mock
#     reports (CoHDI/cohdi-ci-mock's app.py hardcodes fabric_id: 1)
#   - CDI_ENDPOINT: fixed hostname -> CDI_ENDPOINT_PLACEHOLDER (replaced
#     with the mock-server ClusterIP at deploy time, together with
#     HOST_ALIAS_IP_PLACEHOLDER in hostAliases)
#   - fti_cdi: dummy credentials for the mock backend
global:
  common:
    configData:
      deviceInfo: |
        - index: 1
          cdi-model-name: "a100"
          dra-attributes:
            productName: "NVIDIA A100 80GB PCIe"
            type: "gpu"
            uuid: ""
          driver-name: "gpu.nvidia.com"
          k8s-device-name: "nvidia-a100-80"
          cannot-coexist-with: [2,3,4]
        - index: 2
          cdi-model-name: "L40S"
          dra-attributes:
            productName: "NVIDIA L40S"
            type: "gpu"
            uuid: ""
          driver-name: "gpu.nvidia.com"
          k8s-device-name: "nvidia-l40s"
          cannot-coexist-with: [1,3,4]
        - index: 3
          cdi-model-name: "a30"
          dra-attributes:
            productName: "NVIDIA A30"
            type: "gpu"
            uuid: ""
          driver-name: "gpu.nvidia.com"
          k8s-device-name: "nvidia-a30"
          cannot-coexist-with: [1,2,4]
        - index: 4
          cdi-model-name: "t4"
          dra-attributes:
            productName: "Tesla T4"
            type: "gpu"
            uuid: ""
          driver-name: "gpu.nvidia.com"
          k8s-device-name: "nvidia-t4"
          cannot-coexist-with: [1,2,3]
      fabricIdRange: '[1]'
  fti_cdi:
    credentials:
      username: "username"
      password: "password"
      realm: "00000000-0000-0000-0000-000000000000"
      client_id: "cdi"
      client_secret: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    env:
      CDI_ENDPOINT: "CDI_ENDPOINT_PLACEHOLDER"
      CLUSTER_ID: ""
      TENANT_ID: "00000000-0000-0000-0000-000000000000"
